services:
  postgres:
    image: postgres:17-alpine
    container_name: daily-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d daily_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-blue:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://planner:planner_dev_password@postgres:5432/daily_planner?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-green:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://planner:planner_dev_password@postgres:5432/daily_planner?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: daily-planner-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/upstream:/etc/nginx/upstream:ro
    depends_on:
      api-blue:
        condition: service_healthy
      api-green:
        condition: service_healthy
  web:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    container_name: daily-planner-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api-blue:
        condition: service_healthy
volumes:
  postgres_data:
